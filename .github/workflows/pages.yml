# The project page, animan-ai.github.io/DuckBuddy: site/build.py turns site/content into static
# pages, with the pictures from docs/media. Settings → Pages → Source must be "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/media/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7 pymdown-extensions==10.16
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
